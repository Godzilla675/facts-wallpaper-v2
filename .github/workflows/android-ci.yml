name: Android CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Lint, unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Secret-leak gate
        shell: bash
        run: |
          set -euo pipefail
          matches=$(git ls-files -z \
            | xargs -0 grep -InE 'AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9]{20,}|[Bb]earer[[:space:]]+[A-Za-z0-9._~+/=-]{20,}' \
            || true)
          if [ -n "$matches" ]; then
            echo "::error::Potential hardcoded credentials detected in tracked files."
            echo "$matches"
            exit 1
          fi
          echo "No hardcoded provider keys or bearer tokens detected."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Lint, test and assemble
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --console=plain --no-daemon
